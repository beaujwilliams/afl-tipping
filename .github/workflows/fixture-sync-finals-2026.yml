name: Fixture sync (2026 finals)

on:
  schedule:
    # 10:00am Australia/Melbourne (AEST, UTC+10) after Round 24 and Wildcard Round.
    - cron: "0 0 24,31 8 *"
    # 10:00am Australia/Melbourne (AEST, UTC+10) after Finals Weeks 1-3.
    - cron: "0 0 7,14,21 9 *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        required: false
        default: "2026"

jobs:
  sync-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fixture sync endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SEASON_INPUT: ${{ github.event.inputs.season }}
          SEASON_DEFAULT: "2026"
        run: |
          set -euo pipefail

          BASE_URL="${SITE_URL:-https://www.complicatedtips.com}"
          BASE_URL="${BASE_URL%/}"
          SEASON="${SEASON_INPUT:-$SEASON_DEFAULT}"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            exit 1
          fi

          URL="${BASE_URL}/api/admin/sync-fixture?season=${SEASON}"
          echo "Calling ${URL}"

          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${URL}"
