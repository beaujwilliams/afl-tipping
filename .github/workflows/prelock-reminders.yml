name: Site automation tick (manual)

on:
  workflow_dispatch:

jobs:
  run-manual-automation-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger active scoring automation
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SEASON: "2026"
        run: |
          set -euo pipefail

          BASE_URL="${SITE_URL:-https://www.complicatedtips.com}"
          BASE_URL="${BASE_URL%/}"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            exit 1
          fi

          URL="${BASE_URL}/api/admin/run-scoring-automation?season=${SEASON}&scope=active&job_kind=scoring_15m"
          echo "Calling ${URL}"

          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${URL}"

      - name: Trigger pre-lock reminder endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SEASON: "2026"
        run: |
          set -euo pipefail

          BASE_URL="${SITE_URL:-https://www.complicatedtips.com}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret: CRON_SECRET"
            exit 1
          fi

          URL="${BASE_URL}/api/admin/send-prelock-reminders?season=${SEASON}&hours_before_lock=3&window_minutes=10&window_direction=before"
          echo "Calling ${URL}"

          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${URL}"
